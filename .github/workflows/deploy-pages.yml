name: Deploy La Tiendita to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type "yes" only when the store is ready to be public
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'yes' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir _site
          cp INICIO.HTML _site/index.html
          cp FUNCIONAMIENTO.JS ESTILO.CSS _site/
          node -e "require('fs').writeFileSync('_site/MAPS_CONFIG.JS', 'window.GOOGLE_MAPS_API_KEY = ' + JSON.stringify(process.env.GOOGLE_MAPS_API_KEY || '') + ';\\n')"
          node -e "require('fs').writeFileSync('_site/SUPABASE_CONFIG.JS', 'window.LA_TIENDITA_SUPABASE = ' + JSON.stringify({url: process.env.SUPABASE_URL || '', anonKey: process.env.SUPABASE_ANON_KEY || ''}) + ';\\n')"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
